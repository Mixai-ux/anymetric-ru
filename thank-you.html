<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0a2e">
<meta name="robots" content="noindex">
<title>Получили — anymetric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:linear-gradient(180deg,#0f0a2e 0%,#1a1140 100%);
    color:#f4f2ff;
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:18px 20px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex;align-items:center;justify-content:space-between;
  }
  header a{color:#f4f2ff;text-decoration:none;font-weight:600;font-size:18px}
  main{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:40px 20px;
  }
  .box{max-width:480px;width:100%;text-align:center;}
  .check{
    width:64px;height:64px;border-radius:50%;
    background:rgba(255,185,76,0.12);
    border:2px solid rgba(255,185,76,0.4);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 24px;
    font-size:28px;
  }
  h1{font-size:32px;font-weight:800;letter-spacing:-0.02em;margin-bottom:12px}
  p{color:#a39ec7;font-size:16px;line-height:1.6;margin-bottom:28px}
  p strong{color:#f4f2ff}
  a.btn{
    display:inline-block;
    background:#ffb94c;color:#1a1140;
    text-decoration:none;font-weight:700;font-size:15px;
    padding:14px 28px;border-radius:10px;
  }
  a.btn:active{transform:scale(0.98)}
</style>
</head>
<body>
<header>
  <a href="/">&#9650; anymetric</a>
</header>
<main>
  <div class="box">
    <div class="check">✓</div>
    <h1>Получили.</h1>
    <p>Senior AI PM рассмотрит запрос и ответит в течение <strong>48 часов</strong>.<br>Без отдела продаж. Без последующих коммуникаций, если вы их не хотите.</p>
    <a class="btn" href="/">← На главную</a>
  </div>
</main>
</body>
</html>
